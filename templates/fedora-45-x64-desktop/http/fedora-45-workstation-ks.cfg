#version=FEDORA
# Booting from the Server netinst ISO (not Live media - see the template
# README for why) means this installer has no bundled packages at all;
# every package, including the base system, comes from this repo.
url --mirrorlist="https://mirrors.fedoraproject.org/metalink?repo=fedora-45&arch=x86_64"

ignoredisk --only-use=sda
clearpart --none --initlabel
bootloader --location=mbr --boot-drive=sda
text
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8

network --bootproto=dhcp --ipv6=auto --hostname=fedora45.local --activate
rootpw root
# A real kickstart `user` (not a %post useradd) so Anaconda/GNOME
# Initial Setup recognizes an admin account already exists and skips the
# first-login setup wizard.
user --name=localuser --password=password --groups=wheel
firstboot --disabled
services --enabled="sshd,NetworkManager,chronyd" --disabled="kdump"
timezone Etc/UTC --utc

# Fedora 45's Anaconda defaults to GPT labeling even for BIOS boot, and
# GPT + BIOS needs a dedicated biosboot partition for GRUB2's core.img -
# without one, Anaconda can't resolve where the bootloader goes and the
# Installation Destination step fails with "Kickstart insufficient"
# (confirmed live: Rocky 9's kickstart, which this was adapted from,
# never needed this, likely because its older Anaconda still defaults to
# MBR/msdos labeling for a disk this size).
part biosboot --fstype="biosboot" --size=1
part / --fstype="xfs" --grow --size=10240
part swap --fstype="swap" --size=2048

reboot

%packages
@^workstation-product-environment
openssh-server
openssh-clients
qemu-guest-agent
sudo
python3
python3-libselinux
vim
curl
-a*firmware*
-b43-openfwwf
-b*firmware*
-i*firmware*
-libertas-usb8388-firmware
-n*firmware*
-q*firmware*
-r*firmware*
-x*firmware*
-z*firmware*
%end

%post

# @^workstation-product-environment does NOT reliably flip the default
# systemd target on its own - confirmed live: a build with this group
# selected still booted to a text login (multi-user.target), not GDM.
# Set it explicitly rather than relying on package-preset behavior.
systemctl set-default graphical.target

echo "localuser ALL=(ALL) ALL" >> /etc/sudoers

# Removing firewalld, matching Rocky's kickstart (which this template's
# %post is otherwise adapted from) - confirmed live: with firewalld left
# at its install default, sshd was active and listening but still
# unreachable from outside the guest.
echo "Removing firewalld."
dnf -C -y remove firewalld --setopt="clean_requirements_on_remove=1"

# allow root to SSH (Packer connects as root)
mkdir -m 0700 -p /root/.ssh
restorecon -R /root/.ssh > /dev/null 2>&1
sed -i 's/#\?\(PermitRootLogin\s*\).*$/\1 yes/' /etc/ssh/sshd_config

# make sure firstboot/initial-setup don't start
echo "RUN_FIRSTBOOT=NO" > /etc/sysconfig/firstboot

echo "Fixing SELinux contexts."
touch /var/log/cron
touch /var/log/boot.log
/usr/sbin/fixfiles -R -a restore

dnf update -y

sed -i "s/^.*requiretty/#Defaults requiretty/" /etc/sudoers

# Remove machine identification and state
for netdev in $(nmcli -t dev | cut -d: -f1 | grep -v lo); do
    sed -i -e '/uuid=/d' /etc/NetworkManager/system-connections/$netdev.nmconnection 2>/dev/null
    sed -i -e '/dhcp-/d' /etc/NetworkManager/system-connections/$netdev.nmconnection 2>/dev/null
    sed -i -e '/origin/d' /etc/NetworkManager/system-connections/$netdev.nmconnection 2>/dev/null
    sed -i -e '/timestamp/d' /etc/NetworkManager/system-connections/$netdev.nmconnection 2>/dev/null
done
truncate -s 0 /etc/machine-id /etc/resolv.conf
/bin/rm -rf /etc/ssh/ssh_host_*

# Clean DNF cache and logs
dnf clean all
/bin/rm -rf /root/* /tmp/* /tmp/.[a-zA-Z]* /var/tmp/*
/bin/rm -rf /var/log/*debug /var/log/anaconda
truncate -s 0 /var/log/audit/audit.log /var/log/messages /var/log/secure 2>/dev/null
truncate -s 0 /var/log/btmp /var/log/wtmp /var/log/lastlog 2>/dev/null

dracut -f --regenerate-all

%end
